# Developer profile: ./mvnw spring-boot:run activates it by default; with java -jar pass
# --spring.profiles.active=local. Spring Boot reads ./config/ from the working directory, so this
# file is never packaged into the jar. The credentials are throwaway values for local runs only;
# APP_SECURITY_USERNAME / APP_SECURITY_PASSWORD still override them.
logging:
  structured:
    format:
      # Empty: Spring Boot's plain-text console format instead of ECS JSON.
      console: ""

app:
  security:
    username: local
    password: local
